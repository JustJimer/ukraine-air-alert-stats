name: Build and deploy

# Three triggers: every push to main, a daily refresh so the upstream feed's
# new alerts reach the site without anyone touching it, and a manual button.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * *"   # 04:20 UTC daily, after the upstream feed updates
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch the feed and pack it for the browser
        run: python build.py --update

      - name: Check the JavaScript port still matches the Python reference
        run: |
          python parity.py
          node check_parity.js

      # parity.json is a test fixture, not part of the site.
      - name: Drop the test fixture
        run: rm -f web/data/parity.json web/parity.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=ukraine-air-alert-stats
