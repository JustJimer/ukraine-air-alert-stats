name: Daily refresh

# Cloudflare Workers Builds rebuilds on every push by itself, but it has no
# schedule of its own — so this pings a Deploy Hook once a day to pull in the
# new alerts the upstream feed has published since the last build.
#
# Needs one repository secret, CLOUDFLARE_DEPLOY_HOOK_URL, created under
# Workers & Pages > the Worker > Settings > Builds > Deploy Hooks. It only
# triggers a build of this project, so it is far less sensitive than an
# account API token.
on:
  schedule:
    # 04:00 UTC = 07:00 Kyiv in summer, an hour after the upstream feed lands.
    # Its commits arrive between 01:23 and 03:19 UTC (04:23–06:19 Kyiv) across
    # the last fortnight, so this clears the latest of them by ~40 minutes.
    #
    # Cron is UTC only, so in winter this reads 06:00 Kyiv. That is still after
    # the feed, which runs on its own UTC schedule and does not shift — only
    # the wall-clock label moves, not the ordering.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Cloudflare to rebuild
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not set — add it in repo settings." >&2
            exit 1
          fi
          # --fail so an HTTP error fails the job instead of passing quietly.
          curl --fail --silent --show-error -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
