<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parity check — stats.js vs airalert.stats</title>
<style>
  body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; background: #f9fcf7;
         color: #033520; margin: 0; padding: 24px; }
  h1 { font-size: 17px; }
  #summary { font-size: 15px; font-weight: 600; margin: 14px 0 18px; }
  .pass { color: #01ab4d; } .fail { color: #ff665b; }
  table { border-collapse: collapse; width: 100%; max-width: 1000px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ccd5c8; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; color: #5a6d5f; }
  code { font-family: Consolas, monospace; font-size: 12px; }
  ul { margin: 4px 0; padding-left: 18px; }
</style>
</head>
<body>
<h1>Parity check — <code>stats.js</code> vs <code>airalert.stats</code></h1>
<div id="summary">running…</div>
<table><thead><tr><th>Scenario</th><th>Result</th><th>Differences</th></tr></thead>
<tbody id="rows"></tbody></table>

<script src="stats.js"></script>
<script>
// Tight on purpose: the port is expected to reproduce Python exactly, so this
// only absorbs float noise, not a genuine rounding disagreement.
const TOLERANCE = 1e-6;

/* Walk both payloads together and collect every field that disagrees. */
function diff(expected, actual, path, out) {
  if (expected === null || expected === undefined) {
    if (actual !== null && actual !== undefined) out.push(`${path}: expected null, got ${actual}`);
    return;
  }
  if (typeof expected === "number") {
    if (typeof actual !== "number") return out.push(`${path}: expected ${expected}, got ${actual}`);
    if (Math.abs(expected - actual) > TOLERANCE) out.push(`${path}: ${expected} vs ${actual}`);
    return;
  }
  if (typeof expected === "string" || typeof expected === "boolean") {
    if (expected !== actual) out.push(`${path}: "${expected}" vs "${actual}"`);
    return;
  }
  if (Array.isArray(expected)) {
    if (!Array.isArray(actual)) return out.push(`${path}: not an array`);
    if (expected.length !== actual.length) {
      return out.push(`${path}: length ${expected.length} vs ${actual.length}`);
    }
    expected.forEach((v, i) => diff(v, actual[i], `${path}[${i}]`, out));
    return;
  }
  for (const key of Object.keys(expected)) {
    diff(expected[key], actual?.[key], path ? `${path}.${key}` : key, out);
  }
}

(async () => {
  const [meta, bin, cases] = await Promise.all([
    fetch("data/meta.json").then(r => r.json()),
    fetch("data/alerts.bin").then(r => r.arrayBuffer()),
    fetch("data/parity.json").then(r => r.json()),
  ]);
  AlertStats.load(meta, bin);

  let passed = 0;
  const rows = document.getElementById("rows");

  for (const { label, query, expected } of cases) {
    const actual = AlertStats.report({
      oblast: query.oblast, raion: query.raion, hromada: query.hromada,
      start: query.start, end: query.end,
      merge: query.merge === undefined ? null : query.merge,
      standingDays: "standing_days" in query ? query.standing_days : undefined,
      hours: query.hours || [],
    });

    const problems = [];
    // `period` is compared loosely: Python reports ISO timestamps, the page
    // keeps the YYYY-MM-DD the user picked. Everything else must match.
    for (const key of ["mode", "hours", "summary", "declarations", "standing", "by_month", "by_hour", "ranking", "area"]) {
      diff(expected[key], actual[key], key, problems);
    }

    if (!problems.length) passed++;
    rows.insertAdjacentHTML("beforeend", `<tr>
      <td>${label}</td>
      <td class="${problems.length ? "fail" : "pass"}">${problems.length ? "FAIL" : "pass"}</td>
      <td>${problems.length ? `<ul>${problems.slice(0, 8).map(p => `<li><code>${p}</code></li>`).join("")}</ul>` : ""}</td>
    </tr>`);
  }

  const ok = passed === cases.length;
  const box = document.getElementById("summary");
  box.className = ok ? "pass" : "fail";
  box.textContent = `${passed} / ${cases.length} scenarios match`;
  window.PARITY = { passed, total: cases.length, ok };
})();
</script>
</body>
</html>
