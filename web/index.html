<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukraine Air Alert Stats</title>
<meta name="description" content="How many air raid alerts Ukraine has had, how long they lasted on average, and the shortest and longest — filtered by period and by oblast, raion or hromada.">
<meta name="color-scheme" content="light">

<!-- Pasted into a chat app, a bare URL shows nothing. These give it a title,
     a summary and an icon. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ukraine Air Alert Stats">
<meta property="og:description" content="Alert counts and durations across Ukraine, by period and by area.">
<meta name="twitter:card" content="summary">

<!-- Inline so the page stays self-contained and costs no extra request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23033520'/%3E%3Cpath d='M16 7c-4.4 0-8 3.6-8 8v4.5h16V15c0-4.4-3.6-8-8-8z' fill='%2301ab4d'/%3E%3Crect x='6' y='20.5' width='20' height='3' rx='1.5' fill='%23d1fd68'/%3E%3Crect x='14.6' y='24.5' width='2.8' height='3' rx='1.4' fill='%23ff665b'/%3E%3C/svg%3E">
<style>
  :root {
    /* NF primary palette */
    --nf-green: #01ab4d;
    --nf-dark-green: #045835;
    --nf-super-dark-green: #033520;   /* digital typography only */
    --nf-reflex-green: #d1fd68;       /* CTA & metadata, used sparingly */
    --nf-neutral-1: #e6e9e1;
    --nf-neutral-2: #f9fcf7;

    /* NF additional palette — illustrations & graphs only */
    --nf-blue: #1c6682;
    --nf-light-blue: #9ec9ec;
    --nf-orange: #ffa629;
    --nf-yellow: #ffcd29;
    --nf-charcoal: #333333;
    --nf-red: #ff665b;
    --nf-salmon: #f9b4a0;
    --nf-blush: #fce8e2;

    /* roles */
    --bg: var(--nf-neutral-1);
    --panel: var(--nf-neutral-2);
    --line: #ccd5c8;
    --ink: var(--nf-super-dark-green);
    --muted: #5a6d5f;
    --bar: var(--nf-green);
    --bar-hi: var(--nf-dark-green);
    --bar-alt: var(--nf-blue);
    --bar-alt-hi: #124b62;
    --bar-off: var(--nf-light-blue);

    /* NF's additional palette is specified for illustrations and graphs, not
       typography, and #ff665b bears that out: 2.8:1 on these surfaces, under
       the 4.5 AA needs for text and under even the 3.0 large-text bar. This
       darker red reads as the same colour and clears both (5.4 and 4.5).
       #ff665b stays where it belongs, on the charts. */
    --nf-red-text: #c62d1f;
    --danger: var(--nf-red-text);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 18px 24px; background: var(--panel); border-bottom: 2px solid var(--nf-green);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  h1 span { color: var(--nf-red-text); }
  .coverage { color: var(--muted); font-size: 12px; }

  /* Pushed to the right of the header so data freshness is the last thing
     read there, and never buried in the coverage line. */
  .latest {
    margin-left: auto; display: flex; align-items: baseline; gap: 7px;
    background: var(--nf-neutral-1); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 13px; white-space: nowrap;
    max-width: 100%; flex-wrap: wrap;   /* wrap rather than push the page wide */
  }
  .latest .k { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .latest .v { font-size: 13px; font-weight: 600; color: var(--nf-dark-green); font-variant-numeric: tabular-nums; }

  .disclaimer {
    background: var(--nf-blush);
    border-bottom: 1px solid var(--nf-salmon);
    padding: 11px 24px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .disclaimer strong { letter-spacing: .2px; }
  .disclaimer a { color: var(--nf-dark-green); }

  main { padding: 20px 24px 60px; max-width: 1180px; }

  .filters {
    display: grid; gap: 12px; align-items: end;
    /* min() so a column can go under 170px rather than forcing the whole page
       to scroll sideways on a narrow screen. */
    grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 8px;
  }
  /* On a phone six stacked controls pushed the headline figures three screens
     down. Collapsed by default there, with the current selection in the
     summary so the state is still readable while closed. */
  #filters-panel > summary {
    display: none; cursor: pointer; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; font-size: 13px; margin-bottom: 8px;
  }
  #filters-panel > summary::-webkit-details-marker { display: none; }
  #filters-panel > summary::after { content: " ▾"; color: var(--muted); }
  #filters-panel[open] > summary::after { content: " ▴"; }
  #filters-panel > summary b { color: var(--nf-dark-green); }

  @media (max-width: 760px) {
    header { padding: 12px 16px; gap: 8px; }
    .latest { margin-left: 0; }
    .disclaimer { padding: 9px 16px; font-size: 12px; }
    main { padding: 14px 16px 48px; }
    #filters-panel > summary { display: block; }
    .cards { margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); }
    .card .v { font-size: 21px; }
    section { margin-top: 22px; }
    .chart { padding: 12px 10px; }
    /* Total hours is the least load-bearing column; the rest stay readable
       instead of the whole table scrolling sideways. */
    table .drop-narrow { display: none; }
  }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
  select, input {
    width: 100%; background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: inherit;
  }
  select:focus, input:focus {
    outline: 2px solid var(--nf-reflex-green); border-color: var(--nf-green);
  }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; }
  .chips + .chips { margin-top: 8px; }
  .chips .lead {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin-right: 2px;
  }
  .chip {
    background: var(--panel); color: var(--nf-dark-green); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .chip:hover {
    background: var(--nf-reflex-green); border-color: var(--nf-green); color: var(--nf-super-dark-green);
  }
  .chip.active { background: var(--nf-dark-green); border-color: var(--nf-dark-green); color: var(--nf-neutral-2); }
  .chip.active:hover { background: var(--nf-green); border-color: var(--nf-green); color: #fff; }
  .chip.ghost { border-style: dashed; color: var(--muted); }
  #active-filters { margin: 14px 0 0; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); margin-top: 22px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--nf-dark-green);
    border-radius: 10px; padding: 14px 16px;
  }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .card .v { font-size: 25px; font-weight: 600; margin-top: 5px; color: var(--nf-dark-green); }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .card.hi { border-left-color: var(--nf-green); }
  .card.hi .v { color: var(--nf-green); }

  section { margin-top: 30px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .section-head {
    display: flex; align-items: baseline; gap: 12px;
    justify-content: space-between; flex-wrap: wrap;
  }
  .section-head h2 { margin-bottom: 12px; }
  .chip.mini { padding: 3px 11px; font-size: 11px; }
  h2 em { font-style: normal; color: var(--nf-green); text-transform: none; letter-spacing: 0; }

  .chart { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 16px; overflow-x: auto; }
  svg { display: block; }
  svg text { fill: var(--muted); font-size: 10px; }
  svg .baseline { stroke: var(--line); }
  /* CSS fill overrides the presentation attribute, so hover restyles the bar */
  svg rect[data-tip] { transition: fill .1s; }
  svg rect.hit { cursor: pointer; }
  /* The hit area takes the pointer and the focus; the bar beside it is the
     thing that reacts, so hover and keyboard focus look the same. */
  svg rect.hit:hover + rect.m, svg rect.hit:focus-visible + rect.m { fill: var(--bar-hi); }
  svg rect.hit:hover + rect.h, svg rect.hit:focus-visible + rect.h { fill: var(--bar-alt-hi); }
  svg rect.hit:focus-visible {
    outline: none; stroke: var(--nf-super-dark-green); stroke-width: 2; stroke-dasharray: 3 2;
  }
  svg rect.sel { stroke: var(--nf-super-dark-green); stroke-width: 1.5; }
  svg rect.dim { fill: var(--bar-off); }
  /* Drag selection band, drawn over the bars but never intercepting input. */
  svg rect.band {
    pointer-events: none; fill: var(--nf-reflex-green); fill-opacity: .4;
    stroke: var(--nf-dark-green); stroke-width: 1; visibility: hidden;
  }
  svg[data-kind] { user-select: none; -webkit-user-select: none; }
  svg[data-kind].dragging { cursor: ew-resize; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--nf-neutral-1); }
  tbody tr.clickable { cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 16px 24px; color: var(--muted); font-size: 12px;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: space-between;
  }
  footer a { color: var(--nf-dark-green); }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .err { color: var(--danger); padding: 14px; }
  .standing .chart { border-left: 3px solid var(--nf-orange); }

  #tip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0;
    transition: opacity .1s; background: var(--nf-super-dark-green); color: var(--nf-neutral-2);
    border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 4px 14px rgba(3, 53, 32, .28); max-width: 240px;
  }
  #tip.on { opacity: 1; }
  #tip b { color: var(--nf-reflex-green); font-weight: 600; }
  #tip .hint { color: var(--nf-light-blue); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Ukraine <span>Air Alert</span> Stats</h1>
  <div class="coverage" id="coverage">loading…</div>
  <div class="latest" id="latest" hidden>
    <span class="k">Latest stored alert</span><span class="v" id="latest-value"></span>
  </div>
</header>

<div class="disclaimer" role="note">
  Source data comes from the
  <a href="https://github.com/Vadimkin/ukrainian-air-raid-sirens-dataset" target="_blank" rel="noopener noreferrer">ukrainian-air-raid-sirens-dataset</a>,
  and the processing behind them may contain mistakes — the
  <a href="https://github.com/JustJimer/ukraine-air-alert-stats" target="_blank" rel="noopener noreferrer">code is open</a>
  if you want to check something.
</div>

<main>
  <details id="filters-panel" open>
    <summary id="filters-summary">Filters</summary>
  <div class="filters">
    <div>
      <label for="oblast">Oblast</label>
      <select id="oblast"><option value="">All country</option></select>
    </div>
    <div>
      <label for="raion">Raion</label>
      <select id="raion" disabled><option value="">All raions</option></select>
    </div>
    <div>
      <label for="hromada">Hromada</label>
      <select id="hromada" disabled><option value="">All hromadas</option></select>
    </div>
    <div>
      <label for="start">From</label>
      <input type="date" id="start">
    </div>
    <div>
      <label for="end">To</label>
      <input type="date" id="end">
    </div>
    <div>
      <label for="standing">Standing alerts</label>
      <select id="standing">
        <option value="7">Separate if ≥ 7 days</option>
        <option value="1">Separate if ≥ 24 hours</option>
        <option value="30">Separate if ≥ 30 days</option>
        <option value="off">Include in statistics</option>
      </select>
    </div>
    <div>
      <label for="mode">Counting</label>
      <select id="mode">
        <option value="">Auto</option>
        <option value="merged">Merged episodes</option>
        <option value="raw">Raw declarations</option>
      </select>
    </div>
  </div>
  </details>

  <div class="chips" id="presets">
    <button class="chip" data-months="1">Last month</button>
    <button class="chip" data-months="3">Last 3 months</button>
    <button class="chip" data-months="12">Last 12 months</button>
    <button class="chip" data-year="2026">2026</button>
    <button class="chip" data-year="2025">2025</button>
    <button class="chip" data-year="2024">2024</button>
    <button class="chip" data-year="2023">2023</button>
    <button class="chip" data-year="2022">2022</button>
    <button class="chip" data-all="1">All time</button>
    <button class="chip ghost" data-reset="1">Reset filters</button>
  </div>

  <div class="chips" id="active-filters"></div>

  <div id="body"><div class="empty">loading…</div></div>
</main>

<footer>
  <span>made by <a href="https://github.com/JustJimer" target="_blank" rel="noopener noreferrer">jimergoz</a></span>
  <span id="built"></span>
</footer>

<div id="tip"></div>

<script src="stats.js"></script>
<script>
const $ = id => document.getElementById(id);
// v2: the previous key may hold an hours filter of [0] written by the parsing
// bug above, which would keep restoring midnight long after the fix. Changing
// the key discards those entries once instead of stranding them.
const STORE_LAST = "airalert.last.v2";

let META = null;
let HOURS = new Set();     // Kyiv hours selected on the hour chart
let suspend = false;       // stops the cascade firing a reload mid-restore
let MONTH_KEYS = [];       // month chart bar index -> "YYYY-MM"
let drag = null;           // in-progress drag selection
let swallowClick = false;  // a completed drag must not also fire its click

const hm = m => {
  if (m == null) return "–";
  // Under a minute, show seconds. Rounding these to "0m" made a real
  // 40-second alert look like broken data.
  if (m < 1) return `${Math.max(1, Math.round(m * 60))}s`;
  const t = Math.round(m), h = Math.floor(t / 60), r = t % 60;
  return h ? `${h}h ${String(r).padStart(2, "0")}m` : `${r}m`;
};
const num = n => (n ?? 0).toLocaleString("en-US");
const day = s => (s || "").slice(0, 10);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthLabel = ym => { const [y, m] = ym.split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const hh = h => `${String(h).padStart(2, "0")}:00`;

/* "2026-08-14 03:56" in Kyiv local time. sv-SE is used purely because its
   date format is already ISO-shaped. */
const kyivTime = iso => new Date(iso).toLocaleString("sv-SE", {
  timeZone: "Europe/Kyiv",
  year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit",
});

/* "8,9,10,14" -> "08:00–10:59, 14:00" — drag selections are usually runs,
   and listing every hour makes the chip unreadable. */
function describeHours(hours) {
  const runs = [];
  for (const h of [...hours].sort((a, b) => a - b)) {
    const last = runs.at(-1);
    if (last && h === last[1] + 1) last[1] = h;
    else runs.push([h, h]);
  }
  return runs.map(([a, b]) => a === b ? hh(a) : `${hh(a)}–${String(b).padStart(2, "0")}:59`).join(", ");
}

/* ---------- filter state ---------- */

function readState() {
  return {
    oblast: $("oblast").value, raion: $("raion").value, hromada: $("hromada").value,
    start: $("start").value, end: $("end").value,
    mode: $("mode").value, standing: $("standing").value,
    hours: [...HOURS].sort((a, b) => a - b),
  };
}

function applyState(s, reload = true) {
  suspend = true;
  $("oblast").value = s.oblast || "";

  const raions = META.gazetteer[$("oblast").value] || {};
  fill($("raion"), Object.keys(raions), "All raions", !$("oblast").value);
  $("raion").value = s.raion || "";

  const hromadas = raions[$("raion").value] || [];
  fill($("hromada"), hromadas, "All hromadas", !$("raion").value);
  $("hromada").value = s.hromada || "";

  $("start").value = s.start || "";
  $("end").value = s.end || "";
  $("mode").value = s.mode || "";
  $("standing").value = s.standing || "7";
  HOURS = new Set(s.hours || []);

  suspend = false;
  if (reload) load();
}

/* ---------- the URL is the shareable copy of the state ---------- */

/* Only what differs from the default is written, so a plain view keeps a
   clean URL and a filtered one carries exactly what it changed. */
function stateToQuery(s) {
  const q = new URLSearchParams();
  if (s.oblast) q.set("oblast", s.oblast);
  if (s.raion) q.set("raion", s.raion);
  if (s.hromada) q.set("hromada", s.hromada);
  if (s.start && s.start !== day(META.coverage.first)) q.set("from", s.start);
  if (s.end && s.end !== day(META.coverage.last)) q.set("to", s.end);
  if (s.mode) q.set("mode", s.mode);
  if (s.standing !== "7") q.set("standing", s.standing);
  if (s.hours.length) q.set("hours", s.hours.join(","));
  return q.toString();
}

function stateFromQuery() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return null;
  return {
    oblast: q.get("oblast") || "",
    raion: q.get("raion") || "",
    hromada: q.get("hromada") || "",
    start: q.get("from") || day(META.coverage.first),
    end: q.get("to") || day(META.coverage.last),
    mode: q.get("mode") || "",
    standing: q.get("standing") || "7",
    // The empty-string guard matters: "".split(",") is [""], Number("") is 0,
    // and 0 is a valid hour — so a URL carrying any parameter but no `hours`
    // silently selected midnight.
    hours: (q.get("hours") || "").split(",")
      .filter(part => part !== "")
      .map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 23),
  };
}

const defaultState = () => ({
  oblast: "", raion: "", hromada: "",
  start: day(META.coverage.first), end: day(META.coverage.last),
  mode: "", standing: "7", hours: [],
});

/* ---------- last used selection ---------- */

const readStore = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
};
const writeStore = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }
};

/* ---------- boot ---------- */

/* Fetch the packed dataset, preferring the pre-compressed copy.
   Hosts compress text responses automatically but leave application/octet-stream
   alone, so the raw file arrives at full size — about three times bigger. The
   plain file remains the fallback for browsers without DecompressionStream. */
async function loadAlerts() {
  if ("DecompressionStream" in window) {
    try {
      const response = await fetch("data/alerts.bin.gz");
      if (response.ok) {
        const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
        return await new Response(stream).arrayBuffer();
      }
    } catch { /* fall through to the uncompressed copy */ }
  }
  const response = await fetch("data/alerts.bin");
  if (!response.ok) throw new Error(`alerts.bin responded ${response.status}`);
  return response.arrayBuffer();
}

async function boot() {
  // The whole dataset ships with the page — under a megabyte gzipped — so
  // every filter is answered locally with no server and no round-trip.
  let meta, buffer;
  try {
    [meta, buffer] = await Promise.all([
      fetch("data/meta.json").then(r => r.json()),
      loadAlerts(),
    ]);
  } catch (error) {
    $("body").innerHTML = `<div class="err">Could not load the alert data: ${esc(error.message)}</div>`;
    return;
  }

  AlertStats.load(meta, buffer);
  META = { gazetteer: AlertStats.gazetteer(), coverage: meta.coverage, generated_at: meta.generated_at };
  const c = META.coverage;
  $("coverage").textContent =
    `${num(c.rows)} alert records · ${day(c.first)} → ${day(c.last)} · official feed`
    + (c.duplicates_dropped ? ` · ${num(c.duplicates_dropped)} duplicate rows removed` : "");

  // Kyiv time, matching the hour chart, so the whole page speaks one clock.
  $("latest-value").textContent = `${kyivTime(c.last)} Kyiv`;
  $("latest").hidden = false;
  if (META.generated_at) $("built").textContent = `data packed ${kyivTime(META.generated_at)} Kyiv`;

  for (const name of Object.keys(META.gazetteer)) $("oblast").append(new Option(name, name));

  wire();
  // A shared link wins over whatever this browser was last looking at.
  applyState(stateFromQuery() || readStore(STORE_LAST, null) || defaultState());
  addEventListener("popstate", () => applyState(stateFromQuery() || defaultState()));
}

function wire() {
  $("oblast").onchange = () => {
    const raions = META.gazetteer[$("oblast").value] || {};
    fill($("raion"), Object.keys(raions), "All raions", !$("oblast").value);
    fill($("hromada"), [], "All hromadas", true);
    load();
  };
  $("raion").onchange = () => {
    const raions = META.gazetteer[$("oblast").value] || {};
    fill($("hromada"), raions[$("raion").value] || [], "All hromadas", !$("raion").value);
    load();
  };
  for (const id of ["hromada", "start", "end", "mode", "standing"]) $(id).onchange = load;

  $("presets").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.reset) return applyState(defaultState());
    if (b.dataset.all) {
      setPeriod(day(META.coverage.first), day(META.coverage.last));
    } else if (b.dataset.year) {
      setPeriod(`${b.dataset.year}-01-01`, `${b.dataset.year}-12-31`);
    } else {
      const from = new Date(META.coverage.last);
      from.setMonth(from.getMonth() - +b.dataset.months);
      setPeriod(from.toISOString().slice(0, 10), day(META.coverage.last));
    }
  };

  $("active-filters").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.clearHours) { HOURS.clear(); load(); }
  };

  // Charts and the ranking table act as filters.
  $("body").addEventListener("click", e => {
    if (swallowClick) { swallowClick = false; return; }

    const reset = e.target.closest("[data-chart-reset]");
    if (reset) return resetChart(reset.dataset.chartReset);

    const bar = e.target.closest("[data-month], [data-hour]");
    if (bar?.dataset.month) return setPeriod(`${bar.dataset.month}-01`, lastDayOfMonth(bar.dataset.month));
    if (bar?.dataset.hour) return toggleHour(+bar.dataset.hour);

    // Clicking a chart anywhere off the bars clears that chart's own filter.
    const svg = e.target.closest("svg[data-kind]");
    if (svg) return resetChart(svg.dataset.kind);

    const row = e.target.closest("tr[data-area]");
    if (row) return drillInto(row.dataset.area);
  });

  wireKeyboard();
  wireDragSelect();
  wireTooltip();
  wireFilterPanel();
}

/* Open on wide screens, where it costs nothing, and closed on narrow ones,
   where six controls buried the figures. Following the media query rather than
   a one-off check keeps it right when a tablet is rotated. */
function wireFilterPanel() {
  const panel = $("filters-panel");
  const wide = matchMedia("(min-width: 761px)");
  const apply = () => { panel.open = wide.matches; };
  apply();
  wide.addEventListener("change", apply);
}

/* Keeps the collapsed summary describing what is selected, so closing the
   panel never hides what the numbers below are actually showing. */
function describeState(s) {
  const area = s.hromada || s.raion || s.oblast || "All country";
  const whole = s.start === day(META.coverage.first) && s.end === day(META.coverage.last);
  const bits = [whole ? "all time" : `${s.start} → ${s.end}`];
  if (s.hours.length) bits.push(describeHours(s.hours));
  return `<b>${esc(area)}</b> · ${esc(bits.join(" · "))}`;
}

/* Everything on this page was mouse-only: the bars and the drill-down rows
   carry the whole interaction and none of it could be reached from a keyboard.
   Bars use a roving tabindex — one stop per chart, arrows to move between
   bars — because 54 months plus 24 hours as individual tab stops would be
   worse than useless. */
function wireKeyboard() {
  $("body").addEventListener("keydown", e => {
    const row = e.target.closest?.("tr[data-area]");
    if (row && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      return drillInto(row.dataset.area);
    }

    const bar = e.target.closest?.("rect.hit");
    if (!bar) return;

    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      bar.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      return;
    }

    const step = { ArrowRight: 1, ArrowLeft: -1, Home: -Infinity, End: Infinity }[e.key];
    if (step === undefined) return;
    e.preventDefault();

    const bars = [...bar.ownerSVGElement.querySelectorAll("rect.hit")];
    const here = bars.indexOf(bar);
    const next = bars[Math.max(0, Math.min(bars.length - 1,
      step === -Infinity ? 0 : step === Infinity ? bars.length - 1 : here + step))];
    if (!next || next === bar) return;

    bar.tabIndex = -1;
    next.tabIndex = 0;
    next.focus();
    next.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}

/* ---------- hold and drag across bars to select a range ---------- */

/* Which bar sits under this client x, in the chart's own coordinates.
   The SVG may be rendered narrower than its viewBox inside a scrolling
   container, so map through the rendered width rather than assuming 1:1. */
function barIndexAt(svg, clientX) {
  const box = svg.getBoundingClientRect();
  const scale = svg.viewBox.baseVal.width / box.width;
  const x = (clientX - box.left) * scale;
  const pad = +svg.dataset.pad, bw = +svg.dataset.bw, count = +svg.dataset.count;
  return Math.max(0, Math.min(count - 1, Math.floor((x - pad) / bw)));
}

function paintBand() {
  const { svg, from, to } = drag;
  const pad = +svg.dataset.pad, bw = +svg.dataset.bw;
  const a = Math.min(from, to), b = Math.max(from, to);
  const band = svg.querySelector("rect.band");
  band.setAttribute("x", pad + a * bw);
  band.setAttribute("width", (b - a + 1) * bw);
  band.style.visibility = "visible";
}

function endDrag(apply) {
  if (!drag) return;
  const { svg, kind, from, to, moved } = drag;
  svg.querySelector("rect.band").style.visibility = "hidden";
  svg.classList.remove("dragging");
  drag = null;

  // A drag that never left its starting bar is really a click — leave it to
  // the click handler so single-bar behaviour stays identical.
  if (!apply || !moved || from === to) return;

  // The browser fires a click straight after pointerup, which must not be read
  // as a single-bar click. The flag self-clears on the next tick so it can
  // never survive a drag that ended without producing a click.
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 0);

  const a = Math.min(from, to), b = Math.max(from, to);
  if (kind === "month") setPeriod(`${MONTH_KEYS[a]}-01`, lastDayOfMonth(MONTH_KEYS[b]));
  else { HOURS = new Set(Array.from({ length: b - a + 1 }, (_, i) => a + i)); load(); }
}

function wireDragSelect() {
  const body = $("body");

  body.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    // A drag ending outside the chart fires no click to consume the flag, so
    // clear it here rather than letting it eat the next legitimate click.
    swallowClick = false;
    const svg = e.target.closest("svg[data-kind]");
    if (!svg) return;
    drag = { svg, kind: svg.dataset.kind, from: barIndexAt(svg, e.clientX), to: 0, moved: false };
    drag.to = drag.from;
    svg.classList.add("dragging");
    paintBand();
    // Two things are deliberately avoided here. preventDefault() on pointerdown
    // suppresses the compatibility mouse events, killing click outright; and
    // setPointerCapture() retargets the following click to the <svg>, so a
    // click would never resolve to the bar under the cursor. Selection and
    // native dragging are blocked by CSS and dragstart instead, and the move
    // and up listeners sit on window so a drag leaving the chart still tracks.
  });

  body.addEventListener("dragstart", e => {
    if (e.target.closest("svg[data-kind]")) e.preventDefault();
  });

  window.addEventListener("pointermove", e => {
    if (!drag) return;
    const i = barIndexAt(drag.svg, e.clientX);
    if (i === drag.to) return;
    drag.to = i;
    drag.moved = true;
    paintBand();
  });

  window.addEventListener("pointerup", () => endDrag(true));
  window.addEventListener("pointercancel", () => endDrag(false));
}

const nextMonth = ym => {
  const [y, m] = ym.split("-").map(Number);
  return m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`;
};

const addDays = (iso, n) => {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};

/* "To" is inclusive of the day shown, which is what a field labelled To
   implies. The statistics take an exclusive upper bound, so the day is added
   back on at the point of the query — see load(). Getting this wrong dropped
   every alert on the most recent day, so "all time" quietly was not. */
const lastDayOfMonth = ym => addDays(nextMonth(ym), -1);

function setPeriod(start, end) {
  $("start").value = start;
  $("end").value = end;
  load();
}

function toggleHour(hour) {
  HOURS.has(hour) ? HOURS.delete(hour) : HOURS.add(hour);
  load();
}

/* Whether the period is narrower than the whole dataset. */
const periodFiltered = s =>
  s.start !== day(META.coverage.first) || s.end !== day(META.coverage.last);

/* Each chart resets only its own filter, leaving the area selection alone. */
function resetChart(kind) {
  if (kind === "month") return setPeriod(day(META.coverage.first), day(META.coverage.last));
  if (!HOURS.size) return;
  HOURS.clear();
  load();
}

/* Clicking a row in the ranking drills one gazetteer level deeper. */
function drillInto(name) {
  if (!$("oblast").value) {
    suspend = true;
    $("oblast").value = name;
    fill($("raion"), Object.keys(META.gazetteer[name] || {}), "All raions", false);
    fill($("hromada"), [], "All hromadas", true);
    suspend = false;
  } else if (!$("raion").value) {
    suspend = true;
    $("raion").value = name;
    fill($("hromada"), (META.gazetteer[$("oblast").value] || {})[name] || [], "All hromadas", false);
    suspend = false;
  } else {
    $("hromada").value = name;
  }
  load();
}

function wireTooltip() {
  const tip = $("tip");
  const hide = () => tip.classList.remove("on");

  document.addEventListener("mousemove", e => {
    if (drag) return hide();     // the band is the feedback while dragging
    const bar = e.target.closest?.("[data-tip]");
    if (!bar) return hide();

    tip.innerHTML = bar.dataset.tip;
    tip.classList.add("on");

    // Measure after filling, then keep the tooltip inside the viewport.
    const box = tip.getBoundingClientRect();
    const x = Math.min(e.clientX + 14, window.innerWidth - box.width - 8);
    const y = e.clientY - box.height - 12;
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${y < 8 ? e.clientY + 18 : y}px`;
  });

  document.addEventListener("mouseleave", hide);
  window.addEventListener("scroll", hide, true);
}

function fill(select, values, placeholder, disabled) {
  select.innerHTML = "";
  select.append(new Option(placeholder, ""));
  for (const v of values) select.append(new Option(v, v));
  select.disabled = disabled;
}

/* ---------- load & render ---------- */

function load() {
  if (suspend) return;
  const s = readState();
  renderActiveFilters(s);
  $("filters-summary").innerHTML = describeState(s);

  // Say what is actually wrong. "No completed alerts in this selection" is
  // true of a backwards range, but sends you looking for the wrong problem.
  if (s.start && s.end && s.start > s.end) {
    $("body").innerHTML = `<div class="empty">
      <strong>From</strong> is after <strong>to</strong> — ${esc(s.start)} → ${esc(s.end)}.<br>
      Swap the dates to see results.</div>`;
    return;
  }

  let data;
  try {
    data = AlertStats.report({
      oblast: s.oblast, raion: s.raion, hromada: s.hromada,
      start: s.start, end: s.end ? addDays(s.end, 1) : s.end,
      merge: s.mode === "merged" ? true : s.mode === "raw" ? false : null,
      standingDays: s.standing === "off" ? null : Number(s.standing),
      hours: s.hours,
    });
  } catch (error) {
    $("body").innerHTML = `<div class="err">${esc(error.message)}</div>`;
    return;
  }

  writeStore(STORE_LAST, s);

  // Reflect the view in the address bar so it can be linked, bookmarked and
  // stepped back through. Guarded, or replaying history would push duplicates.
  const query = stateToQuery(s);
  if (location.search.replace(/^\?/, "") !== query) {
    history.pushState(null, "", query ? `?${query}` : location.pathname);
  }

  render(data, s);
}

function renderActiveFilters(s) {
  const box = $("active-filters");
  if (!s.hours.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<span class="lead">Hour filter</span>`
    + `<button class="chip active" data-clear-hours="1">${esc(describeHours(s.hours))} ✕</button>`;
}

function render(d, s) {
  const sum = d.summary;
  const merged = d.mode === "merged";
  const area = d.area.hromada || d.area.raion || d.area.oblast || "all country";

  if (!sum.finished) {
    $("body").innerHTML = `<div class="empty">No completed alerts in this selection.</div>`
      + `<section><h2>When alerts start (hour of day, Kyiv time)</h2>
           <div class="chart">${hourChart(d.by_hour, s.hours,
             Math.max(300, ($("body").clientWidth || 900) - 34))}</div></section>`;
    return;
  }

  // Merged episodes span a territory rather than one declared area, so they
  // carry no place name — show the date alone in that case.
  const when = w => {
    const place = [w.hromada, w.raion, w.oblast].filter(Boolean)[0];
    return place ? `${day(w.started_at)} · ${place}` : day(w.started_at);
  };
  const nextLevel = !d.area.oblast ? "oblasts" : !d.area.raion ? "raions" : "hromadas";
  const canDrill = !d.area.hromada;
  // Measured before the charts are built so they can be drawn to fit.
  const avail = Math.max(300, ($("body").clientWidth || 900) - 34);

  $("body").innerHTML = `
    <div class="cards">
      ${card("Alerts", num(sum.count), merged ? `merged from ${num(d.declarations)} declarations` : "raw declarations")}
      ${card("Average length", hm(sum.avg_min), `median ${hm(sum.median_min)}`, true)}
      ${card("Shortest", hm(sum.min_min), when(sum.shortest))}
      ${card("Longest", hm(sum.max_min), when(sum.longest))}
      ${card("Total time", num(Math.round(sum.total_hours)) + " h", `90th pct ${hm(sum.p90_min)}`)}
    </div>
    ${standingBlock(d.standing, area)}

    <section>
      <div class="section-head">
        <h2>Alerts per month — ${esc(area)} <em>· click a bar, or drag across bars for a date range</em></h2>
        ${periodFiltered(s) ? `<button class="chip mini" data-chart-reset="month">Reset date range</button>` : ""}
      </div>
      <div class="chart" id="month-chart">${monthChart(d.by_month, s, avail)}</div>
    </section>

    <section>
      <div class="section-head">
        <h2>When alerts start (hour of day, Kyiv time) <em>· click bars, or drag across them for a time range</em></h2>
        ${s.hours.length ? `<button class="chip mini" data-chart-reset="hour">Reset time range</button>` : ""}
      </div>
      <div class="chart">${hourChart(d.by_hour, s.hours, avail)}</div>
    </section>

    <section>
      <h2>Busiest ${nextLevel} — alerts covering each${canDrill ? ` <em>· click a row to drill in</em>` : ""}</h2>
      <div class="chart">${rankTable(d.ranking, canDrill)}</div>
      <div class="note">
        ${d.ranking.shared ? `<strong>${num(d.ranking.shared)}</strong> of these alerts were declared for the
          whole ${d.area.raion ? "raion" : "oblast"}, so each one covered every ${nextLevel.replace(/s$/, "")}
          and is counted in every row. <em>Own</em> shows the alerts declared for that area specifically.
          Rows therefore add up to more than the ${d.area.raion ? "raion" : "oblast"} total — one area-wide
          siren is a single alert but covers every ${nextLevel.replace(/s$/, "")} at once.` : ""}
        ${merged
          ? "Merged mode collapses overlapping declarations into one territory-wide episode, so an oblast-wide siren and the raion sirens inside it count once. Avoid it for the whole country — a siren is on somewhere almost always, so everything merges into a few month-long episodes."
          : "Raw mode counts every declaration separately, including overlapping oblast- and raion-level ones. This is the right default for all-country figures."}
        Alerts belong to a period by their start time, so none is counted twice or has its duration clipped.
        ${s.hours.length ? "The hour chart keeps showing the full distribution, so you can still see what the hour filter selects against." : ""}
      </div>
    </section>`;
}

const card = (k, v, s, hi) =>
  `<div class="card ${hi ? "hi" : ""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

function monthChart(rows, state, avail) {
  if (!rows.length) return `<div class="empty">no data</div>`;
  // Fill the container, and only overflow when the months genuinely need it.
  const w = Math.max(avail, rows.length * 26), h = 200, pad = 28;
  const max = Math.max(...rows.map(r => r.count), 1);
  const bw = (w - pad * 2) / rows.length;
  const selected = ym => state.start === `${ym}-01` && state.end === lastDayOfMonth(ym);

  const bars = rows.map((r, i) => {
    const bh = (r.count / max) * (h - pad * 2);
    const x = pad + i * bw, y = h - pad - bh;
    const tip = `${monthLabel(r.month)}<br><b>${num(r.count)}</b> alerts<br><b>${num(r.hours)}</b> h total`
              + `<br><span class="hint">click to zoom · drag for a range</span>`;
    const attrs = `data-tip="${esc(tip)}" data-month="${r.month}"`;
    const label = rows.length <= 30 || i % 3 === 0
      ? `<text x="${x + bw / 2}" y="${h - 10}" text-anchor="middle">${r.month.slice(2)}</text>` : "";
    // A full-height hit area keeps short bars easy to hover and click, and is
    // the element that takes keyboard focus — one tab stop per chart, arrow
    // keys between bars, rather than 54 stops in a row.
    const aria = `${monthLabel(r.month)}, ${r.count} alerts`;
    return `<rect class="hit" x="${x}" y="${pad}" width="${bw}" height="${h - pad * 2}" fill="transparent"
                  role="button" tabindex="${i === 0 ? 0 : -1}" aria-label="${esc(aria)}" ${attrs}/>
            <rect class="m ${selected(r.month) ? "sel" : ""}" x="${x + 2}" y="${y}" width="${bw - 4}"
                  height="${Math.max(bh, 1)}" fill="var(--bar)" rx="2" pointer-events="none" ${attrs}/>${label}`;
  }).join("");

  MONTH_KEYS = rows.map(r => r.month);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
      data-kind="month" data-pad="${pad}" data-bw="${bw}" data-count="${rows.length}">
      <text x="4" y="${pad - 8}">${num(max)} max</text>
      <line class="baseline" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>
      ${bars}
      <rect class="band" y="${pad}" height="${h - pad * 2}" x="0" width="0"/></svg>`;
}

function hourChart(hours, selectedHours, avail) {
  // 24 bars always fit, so this tracks the container instead of scrolling.
  // The floor only guards legibility on a very narrow screen, where the chart
  // scrolls inside its own box rather than widening the page.
  const w = Math.min(720, Math.max(240, avail)), h = 150, pad = 26;
  const max = Math.max(...hours, 1), bw = (w - pad * 2) / 24;
  const total = hours.reduce((a, b) => a + b, 0) || 1;
  const picked = new Set(selectedHours || []);
  const filtering = picked.size > 0;

  const bars = hours.map((v, i) => {
    const bh = (v / max) * (h - pad * 2);
    const x = pad + i * bw;
    const on = picked.has(i);
    const tip = `${hh(i)}–${String(i).padStart(2, "0")}:59<br>`
              + `<b>${num(v)}</b> alerts started<br>${(v / total * 100).toFixed(1)}% of the period`
              + `<br><span class="hint">click to ${on ? "remove" : "add"} · drag for a range</span>`;
    const attrs = `data-tip="${esc(tip)}" data-hour="${i}"`;
    const cls = `h ${filtering && !on ? "dim" : ""} ${on ? "sel" : ""}`;
    const aria = `${hh(i)}, ${v} alerts${on ? ", selected" : ""}`;
    return `<rect class="hit" x="${x}" y="${pad}" width="${bw}" height="${h - pad * 2}" fill="transparent"
                  role="button" tabindex="${i === 0 ? 0 : -1}" aria-pressed="${on}" aria-label="${esc(aria)}" ${attrs}/>
            <rect class="${cls}" x="${x + 2}" y="${h - pad - bh}" width="${bw - 4}" height="${Math.max(bh, 1)}"
                  fill="var(--bar-alt)" rx="2" pointer-events="none" ${attrs}/>
            ${i % 2 === 0 ? `<text x="${x + bw / 2}" y="${h - 9}" text-anchor="middle">${i}</text>` : ""}`;
  }).join("");

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
      data-kind="hour" data-pad="${pad}" data-bw="${bw}" data-count="24">
      <text x="4" y="${pad - 8}">${num(max)} max</text>
      <line class="baseline" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>
      ${bars}
      <rect class="band" y="${pad}" height="${h - pad * 2}" x="0" width="0"/></svg>`;
}

function rankTable(rank, clickable) {
  if (!rank.rows.length) return `<div class="empty">no breakdown available</div>`;
  const shared = rank.shared > 0;

  return `<table>
    <thead><tr>
      <th>Area</th><th class="num">Alerts</th>
      ${shared ? `<th class="num">Own</th>` : ""}
      <th class="num drop-narrow">Total h</th><th class="num">Average</th>
    </tr></thead>
    <tbody>${rank.rows.map(r => `<tr class="${clickable ? "clickable" : ""}"
      ${clickable ? `data-area="${esc(r.name)}" tabindex="0" role="button" aria-label="Drill into ${esc(r.name)}"` : ""}>
      <td>${esc(r.name)}</td><td class="num">${num(r.count)}</td>
      ${shared ? `<td class="num">${num(r.own)}</td>` : ""}
      <td class="num drop-narrow">${num(Math.round(r.hours))}</td><td class="num">${hm(r.avg_min)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function standingBlock(st, area) {
  if (!st || !st.count) return "";
  const rows = st.examples.map(e => {
    // A merged episode spans the whole selected territory, so it carries no
    // single declared area. Naming the territory beats an em dash that reads
    // as missing data.
    const where = [e.hromada, e.raion, e.oblast].filter(Boolean)[0]
      || `across ${area}`;
    return `<tr><td>${esc(where)}</td><td class="num">${(e.duration_min / 1440).toFixed(1)} d</td>
            <td class="num">${day(e.started_at)}</td></tr>`;
  }).join("");

  return `<section class="standing">
    <h2>Standing alerts — excluded from the figures above</h2>
    <div class="chart">
      <div class="note" style="margin:0 0 10px">
        ${num(st.count)} alert${st.count > 1 ? "s" : ""} ran for ${st.threshold_days} days or longer
        (${num(Math.round(st.hours))} h total). These are frontline territories where the siren stays
        declared for months — real records, but averaging them in would make “longest” and “average”
        meaningless. Set <em>Standing alerts → Include in statistics</em> to fold them back in.
      </div>
      <table>
        <thead><tr><th>Area</th><th class="num">Duration</th><th class="num">Started</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

boot();
</script>
</body>
</html>
