<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukraine Air Alert Stats</title>
<style>
  :root {
    /* NF primary palette */
    --nf-green: #01ab4d;
    --nf-dark-green: #045835;
    --nf-super-dark-green: #033520;   /* digital typography only */
    --nf-reflex-green: #d1fd68;       /* CTA & metadata, used sparingly */
    --nf-neutral-1: #e6e9e1;
    --nf-neutral-2: #f9fcf7;

    /* NF additional palette — illustrations & graphs only */
    --nf-blue: #1c6682;
    --nf-light-blue: #9ec9ec;
    --nf-orange: #ffa629;
    --nf-yellow: #ffcd29;
    --nf-charcoal: #333333;
    --nf-red: #ff665b;
    --nf-salmon: #f9b4a0;
    --nf-blush: #fce8e2;

    /* roles */
    --bg: var(--nf-neutral-1);
    --panel: var(--nf-neutral-2);
    --line: #ccd5c8;
    --ink: var(--nf-super-dark-green);
    --muted: #5a6d5f;
    --bar: var(--nf-green);
    --bar-hi: var(--nf-dark-green);
    --bar-alt: var(--nf-blue);
    --bar-alt-hi: #124b62;
    --bar-off: var(--nf-light-blue);
    --danger: var(--nf-red);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 18px 24px; background: var(--panel); border-bottom: 2px solid var(--nf-green);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  h1 span { color: var(--nf-green); }
  .coverage { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 60px; max-width: 1180px; }

  .filters {
    display: grid; gap: 12px; align-items: end;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 8px;
  }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
  select, input {
    width: 100%; background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: inherit;
  }
  select:focus, input:focus {
    outline: 2px solid var(--nf-reflex-green); border-color: var(--nf-green);
  }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; }
  .chips + .chips { margin-top: 8px; }
  .chips .lead {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin-right: 2px;
  }
  .chip {
    background: var(--panel); color: var(--nf-dark-green); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .chip:hover {
    background: var(--nf-reflex-green); border-color: var(--nf-green); color: var(--nf-super-dark-green);
  }
  .chip.active { background: var(--nf-dark-green); border-color: var(--nf-dark-green); color: var(--nf-neutral-2); }
  .chip.active:hover { background: var(--nf-green); border-color: var(--nf-green); color: #fff; }
  .chip.ghost { border-style: dashed; color: var(--muted); }
  #active-filters { margin: 14px 0 0; }
  #recents:empty { display: none; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); margin-top: 22px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--nf-dark-green);
    border-radius: 10px; padding: 14px 16px;
  }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .card .v { font-size: 25px; font-weight: 600; margin-top: 5px; color: var(--nf-dark-green); }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .card.hi { border-left-color: var(--nf-green); }
  .card.hi .v { color: var(--nf-green); }

  section { margin-top: 30px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  h2 em { font-style: normal; color: var(--nf-green); text-transform: none; letter-spacing: 0; }

  .chart { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 16px; overflow-x: auto; }
  svg { display: block; }
  svg text { fill: var(--muted); font-size: 10px; }
  svg .baseline { stroke: var(--line); }
  /* CSS fill overrides the presentation attribute, so hover restyles the bar */
  svg rect[data-tip] { transition: fill .1s; }
  svg rect.hit { cursor: pointer; }
  svg rect.m:hover { fill: var(--bar-hi); }
  svg rect.h:hover { fill: var(--bar-alt-hi); }
  svg rect.sel { stroke: var(--nf-super-dark-green); stroke-width: 1.5; }
  svg rect.dim { fill: var(--bar-off); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--nf-neutral-1); }
  tbody tr.clickable { cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .err { color: var(--danger); padding: 14px; }
  .standing .chart { border-left: 3px solid var(--nf-orange); }

  #tip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0;
    transition: opacity .1s; background: var(--nf-super-dark-green); color: var(--nf-neutral-2);
    border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 4px 14px rgba(3, 53, 32, .28); max-width: 240px;
  }
  #tip.on { opacity: 1; }
  #tip b { color: var(--nf-reflex-green); font-weight: 600; }
  #tip .hint { color: var(--nf-light-blue); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Ukraine <span>Air Alert</span> Stats</h1>
  <div class="coverage" id="coverage">loading…</div>
</header>

<main>
  <div class="filters">
    <div>
      <label for="oblast">Oblast</label>
      <select id="oblast"><option value="">All country</option></select>
    </div>
    <div>
      <label for="raion">Raion</label>
      <select id="raion" disabled><option value="">All raions</option></select>
    </div>
    <div>
      <label for="hromada">Hromada</label>
      <select id="hromada" disabled><option value="">All hromadas</option></select>
    </div>
    <div>
      <label for="start">From</label>
      <input type="date" id="start">
    </div>
    <div>
      <label for="end">To</label>
      <input type="date" id="end">
    </div>
    <div>
      <label for="standing">Standing alerts</label>
      <select id="standing">
        <option value="7">Separate if ≥ 7 days</option>
        <option value="1">Separate if ≥ 24 hours</option>
        <option value="30">Separate if ≥ 30 days</option>
        <option value="off">Include in statistics</option>
      </select>
    </div>
    <div>
      <label for="mode">Counting</label>
      <select id="mode">
        <option value="">Auto</option>
        <option value="merged">Merged episodes</option>
        <option value="raw">Raw declarations</option>
      </select>
    </div>
  </div>

  <div class="chips" id="presets">
    <button class="chip" data-months="1">Last month</button>
    <button class="chip" data-months="3">Last 3 months</button>
    <button class="chip" data-months="12">Last 12 months</button>
    <button class="chip" data-year="2026">2026</button>
    <button class="chip" data-year="2025">2025</button>
    <button class="chip" data-year="2024">2024</button>
    <button class="chip" data-year="2023">2023</button>
    <button class="chip" data-year="2022">2022</button>
    <button class="chip" data-all="1">All time</button>
    <button class="chip ghost" data-reset="1">Reset filters</button>
  </div>

  <div class="chips" id="recents"></div>
  <div class="chips" id="active-filters"></div>

  <div id="body"><div class="empty">loading…</div></div>
</main>

<div id="tip"></div>

<script>
const $ = id => document.getElementById(id);
const STORE_LAST = "airalert.last.v1";
const STORE_RECENT = "airalert.recent.v1";
const RECENT_MAX = 6;

let META = null;
let HOURS = new Set();     // Kyiv hours selected on the hour chart
let suspend = false;       // stops the cascade firing a reload mid-restore
let firstLoad = true;      // the restored/default view is not a "recent"

const hm = m => {
  if (m == null) return "–";
  const t = Math.round(m), h = Math.floor(t / 60), r = t % 60;
  return h ? `${h}h ${String(r).padStart(2, "0")}m` : `${r}m`;
};
const num = n => (n ?? 0).toLocaleString("en-US");
const day = s => (s || "").slice(0, 10);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthLabel = ym => { const [y, m] = ym.split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const hh = h => `${String(h).padStart(2, "0")}:00`;

/* ---------- filter state ---------- */

function readState() {
  return {
    oblast: $("oblast").value, raion: $("raion").value, hromada: $("hromada").value,
    start: $("start").value, end: $("end").value,
    mode: $("mode").value, standing: $("standing").value,
    hours: [...HOURS].sort((a, b) => a - b),
  };
}

function applyState(s, reload = true) {
  suspend = true;
  $("oblast").value = s.oblast || "";

  const raions = META.gazetteer[$("oblast").value] || {};
  fill($("raion"), Object.keys(raions), "All raions", !$("oblast").value);
  $("raion").value = s.raion || "";

  const hromadas = raions[$("raion").value] || [];
  fill($("hromada"), hromadas, "All hromadas", !$("raion").value);
  $("hromada").value = s.hromada || "";

  $("start").value = s.start || "";
  $("end").value = s.end || "";
  $("mode").value = s.mode || "";
  $("standing").value = s.standing || "7";
  HOURS = new Set(s.hours || []);

  suspend = false;
  if (reload) load();
}

const defaultState = () => ({
  oblast: "", raion: "", hromada: "",
  start: day(META.coverage.first), end: day(META.coverage.last),
  mode: "", standing: "7", hours: [],
});

/* ---------- last used / recent ---------- */

const readStore = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
};
const writeStore = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }
};

function stateLabel(s) {
  const area = s.hromada || s.raion || s.oblast || "All country";
  const bits = [area];

  const oneMonth = s.start && s.end
    && s.start.slice(8) === "01"
    && s.end === nextMonth(s.start.slice(0, 7));
  if (oneMonth) bits.push(monthLabel(s.start.slice(0, 7)));
  else if (s.start && s.end) bits.push(`${s.start} → ${s.end}`);

  // Name the hours while the list stays short, so two recents that differ
  // only by hour do not render as the same label.
  if (s.hours?.length) {
    bits.push(s.hours.length <= 3 ? s.hours.map(hh).join(", ") : `${s.hours.length} hours`);
  }
  if (s.mode) bits.push(s.mode);
  return bits.join(" · ");
}

function rememberRecent(s) {
  const key = JSON.stringify(s);
  const recents = readStore(STORE_RECENT, []).filter(r => JSON.stringify(r) !== key);
  recents.unshift(s);
  writeStore(STORE_RECENT, recents.slice(0, RECENT_MAX));
  renderRecents();
}

function renderRecents() {
  const recents = readStore(STORE_RECENT, []);
  const box = $("recents");
  if (!recents.length) { box.innerHTML = ""; return; }

  box.innerHTML = `<span class="lead">Recent</span>`
    + recents.map((r, i) => `<button class="chip" data-recent="${i}">${esc(stateLabel(r))}</button>`).join("")
    + `<button class="chip ghost" data-clear-recent="1">Clear</button>`;
}

/* ---------- boot ---------- */

async function boot() {
  META = await (await fetch("/api/meta")).json();
  const c = META.coverage;
  $("coverage").textContent =
    `${num(c.rows)} alert records · ${day(c.first)} → ${day(c.last)} · official feed`
    + (c.duplicates_dropped ? ` · ${num(c.duplicates_dropped)} duplicate rows removed` : "");

  for (const name of Object.keys(META.gazetteer)) $("oblast").append(new Option(name, name));

  wire();
  renderRecents();
  applyState(readStore(STORE_LAST, null) || defaultState());
}

function wire() {
  $("oblast").onchange = () => {
    const raions = META.gazetteer[$("oblast").value] || {};
    fill($("raion"), Object.keys(raions), "All raions", !$("oblast").value);
    fill($("hromada"), [], "All hromadas", true);
    load();
  };
  $("raion").onchange = () => {
    const raions = META.gazetteer[$("oblast").value] || {};
    fill($("hromada"), raions[$("raion").value] || [], "All hromadas", !$("raion").value);
    load();
  };
  for (const id of ["hromada", "start", "end", "mode", "standing"]) $(id).onchange = load;

  $("presets").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.reset) return applyState(defaultState());
    if (b.dataset.all) {
      setPeriod(day(META.coverage.first), day(META.coverage.last));
    } else if (b.dataset.year) {
      setPeriod(`${b.dataset.year}-01-01`, `${+b.dataset.year + 1}-01-01`);
    } else {
      const from = new Date(META.coverage.last);
      from.setMonth(from.getMonth() - +b.dataset.months);
      setPeriod(from.toISOString().slice(0, 10), day(META.coverage.last));
    }
  };

  $("recents").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.clearRecent) { writeStore(STORE_RECENT, []); return renderRecents(); }
    const s = readStore(STORE_RECENT, [])[+b.dataset.recent];
    if (s) applyState(s);
  };

  $("active-filters").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.clearHours) { HOURS.clear(); load(); }
  };

  // Charts and the ranking table act as filters.
  $("body").addEventListener("click", e => {
    const bar = e.target.closest("[data-month], [data-hour]");
    if (bar?.dataset.month) return setPeriod(`${bar.dataset.month}-01`, nextMonth(bar.dataset.month));
    if (bar?.dataset.hour) return toggleHour(+bar.dataset.hour);

    const row = e.target.closest("tr[data-area]");
    if (row) return drillInto(row.dataset.area);
  });

  wireTooltip();
}

const nextMonth = ym => {
  const [y, m] = ym.split("-").map(Number);
  return m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`;
};

function setPeriod(start, end) {
  $("start").value = start;
  $("end").value = end;
  load();
}

function toggleHour(hour) {
  HOURS.has(hour) ? HOURS.delete(hour) : HOURS.add(hour);
  load();
}

/* Clicking a row in the ranking drills one gazetteer level deeper. */
function drillInto(name) {
  if (!$("oblast").value) {
    suspend = true;
    $("oblast").value = name;
    fill($("raion"), Object.keys(META.gazetteer[name] || {}), "All raions", false);
    fill($("hromada"), [], "All hromadas", true);
    suspend = false;
  } else if (!$("raion").value) {
    suspend = true;
    $("raion").value = name;
    fill($("hromada"), (META.gazetteer[$("oblast").value] || {})[name] || [], "All hromadas", false);
    suspend = false;
  } else {
    $("hromada").value = name;
  }
  load();
}

function wireTooltip() {
  const tip = $("tip");
  const hide = () => tip.classList.remove("on");

  document.addEventListener("mousemove", e => {
    const bar = e.target.closest?.("[data-tip]");
    if (!bar) return hide();

    tip.innerHTML = bar.dataset.tip;
    tip.classList.add("on");

    // Measure after filling, then keep the tooltip inside the viewport.
    const box = tip.getBoundingClientRect();
    const x = Math.min(e.clientX + 14, window.innerWidth - box.width - 8);
    const y = e.clientY - box.height - 12;
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${y < 8 ? e.clientY + 18 : y}px`;
  });

  document.addEventListener("mouseleave", hide);
  window.addEventListener("scroll", hide, true);
}

function fill(select, values, placeholder, disabled) {
  select.innerHTML = "";
  select.append(new Option(placeholder, ""));
  for (const v of values) select.append(new Option(v, v));
  select.disabled = disabled;
}

/* ---------- load & render ---------- */

async function load() {
  if (suspend) return;
  const s = readState();
  const q = new URLSearchParams({ ...s, hours: s.hours.join(",") });

  $("body").innerHTML = `<div class="empty">calculating…</div>`;
  renderActiveFilters(s);

  const data = await (await fetch("/api/stats?" + q)).json();
  if (data.error) { $("body").innerHTML = `<div class="err">${data.error}</div>`; return; }

  writeStore(STORE_LAST, s);
  if (firstLoad) firstLoad = false; else rememberRecent(s);

  render(data, s);
}

function renderActiveFilters(s) {
  const box = $("active-filters");
  if (!s.hours.length) { box.innerHTML = ""; return; }
  const list = s.hours.map(hh).join(", ");
  box.innerHTML = `<span class="lead">Hour filter</span>`
    + `<button class="chip active" data-clear-hours="1">${esc(list)} ✕</button>`;
}

function render(d, s) {
  const sum = d.summary;
  const merged = d.mode === "merged";
  const area = d.area.hromada || d.area.raion || d.area.oblast || "all country";

  if (!sum.finished) {
    $("body").innerHTML = `<div class="empty">No completed alerts in this selection.</div>`
      + `<section><h2>When alerts start (hour of day, Kyiv time)</h2>
           <div class="chart">${hourChart(d.by_hour, s.hours)}</div></section>`;
    return;
  }

  // Merged episodes span a territory rather than one declared area, so they
  // carry no place name — show the date alone in that case.
  const when = w => {
    const place = [w.hromada, w.raion, w.oblast].filter(Boolean)[0];
    return place ? `${day(w.started_at)} · ${place}` : day(w.started_at);
  };
  const nextLevel = !d.area.oblast ? "oblasts" : !d.area.raion ? "raions" : "hromadas";
  const canDrill = !d.area.hromada;

  $("body").innerHTML = `
    <div class="cards">
      ${card("Alerts", num(sum.count), merged ? `merged from ${num(d.declarations)} declarations` : "raw declarations")}
      ${card("Average length", hm(sum.avg_min), `median ${hm(sum.median_min)}`, true)}
      ${card("Shortest", hm(sum.min_min), when(sum.shortest))}
      ${card("Longest", hm(sum.max_min), when(sum.longest))}
      ${card("Total time", num(Math.round(sum.total_hours)) + " h", `90th pct ${hm(sum.p90_min)}`)}
    </div>
    ${standingBlock(d.standing)}

    <section>
      <h2>Alerts per month — ${esc(area)} <em>· click a bar to zoom to that month</em></h2>
      <div class="chart">${monthChart(d.by_month, s)}</div>
    </section>

    <section>
      <h2>When alerts start (hour of day, Kyiv time) <em>· click bars to filter by hour</em></h2>
      <div class="chart">${hourChart(d.by_hour, s.hours)}</div>
    </section>

    <section>
      <h2>Busiest ${nextLevel} — by declared alerts${canDrill ? ` <em>· click a row to drill in</em>` : ""}</h2>
      <div class="chart">${rankTable(d.ranking, canDrill)}</div>
      <div class="note">
        ${merged
          ? "Merged mode collapses overlapping declarations into one territory-wide episode, so an oblast-wide siren and the raion sirens inside it count once. Avoid it for the whole country — a siren is on somewhere almost always, so everything merges into a few month-long episodes."
          : "Raw mode counts every declaration separately, including overlapping oblast- and raion-level ones. This is the right default for all-country figures."}
        Alerts belong to a period by their start time, so none is counted twice or has its duration clipped.
        ${s.hours.length ? "The hour chart keeps showing the full distribution, so you can still see what the hour filter selects against." : ""}
      </div>
    </section>`;
}

const card = (k, v, s, hi) =>
  `<div class="card ${hi ? "hi" : ""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

function monthChart(rows, state) {
  if (!rows.length) return `<div class="empty">no data</div>`;
  const w = Math.max(640, rows.length * 26), h = 200, pad = 28;
  const max = Math.max(...rows.map(r => r.count), 1);
  const bw = (w - pad * 2) / rows.length;
  const selected = ym => state.start === `${ym}-01` && state.end === nextMonth(ym);

  const bars = rows.map((r, i) => {
    const bh = (r.count / max) * (h - pad * 2);
    const x = pad + i * bw, y = h - pad - bh;
    const tip = `${monthLabel(r.month)}<br><b>${num(r.count)}</b> alerts<br><b>${num(r.hours)}</b> h total`
              + `<br><span class="hint">click to zoom to this month</span>`;
    const attrs = `data-tip="${esc(tip)}" data-month="${r.month}"`;
    const label = rows.length <= 30 || i % 3 === 0
      ? `<text x="${x + bw / 2}" y="${h - 10}" text-anchor="middle">${r.month.slice(2)}</text>` : "";
    // A full-height hit area keeps short bars easy to hover and click.
    return `<rect class="hit" x="${x}" y="${pad}" width="${bw}" height="${h - pad * 2}" fill="transparent" ${attrs}/>
            <rect class="m hit ${selected(r.month) ? "sel" : ""}" x="${x + 2}" y="${y}" width="${bw - 4}"
                  height="${Math.max(bh, 1)}" fill="var(--bar)" rx="2" ${attrs}/>${label}`;
  }).join("");

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <text x="4" y="${pad - 8}">${num(max)} max</text>
      <line class="baseline" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>
      ${bars}</svg>`;
}

function hourChart(hours, selectedHours) {
  const w = 640, h = 150, pad = 26;
  const max = Math.max(...hours, 1), bw = (w - pad * 2) / 24;
  const total = hours.reduce((a, b) => a + b, 0) || 1;
  const picked = new Set(selectedHours || []);
  const filtering = picked.size > 0;

  const bars = hours.map((v, i) => {
    const bh = (v / max) * (h - pad * 2);
    const x = pad + i * bw;
    const on = picked.has(i);
    const tip = `${hh(i)}–${String(i).padStart(2, "0")}:59<br>`
              + `<b>${num(v)}</b> alerts started<br>${(v / total * 100).toFixed(1)}% of the period`
              + `<br><span class="hint">click to ${on ? "remove from" : "add to"} the hour filter</span>`;
    const attrs = `data-tip="${esc(tip)}" data-hour="${i}"`;
    const cls = `h hit ${filtering && !on ? "dim" : ""} ${on ? "sel" : ""}`;
    return `<rect class="hit" x="${x}" y="${pad}" width="${bw}" height="${h - pad * 2}" fill="transparent" ${attrs}/>
            <rect class="${cls}" x="${x + 2}" y="${h - pad - bh}" width="${bw - 4}" height="${Math.max(bh, 1)}"
                  fill="var(--bar-alt)" rx="2" ${attrs}/>
            ${i % 2 === 0 ? `<text x="${x + bw / 2}" y="${h - 9}" text-anchor="middle">${i}</text>` : ""}`;
  }).join("");

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <text x="4" y="${pad - 8}">${num(max)} max</text>
      <line class="baseline" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>
      ${bars}</svg>`;
}

function rankTable(rows, clickable) {
  if (!rows.length) return `<div class="empty">no breakdown available</div>`;
  return `<table>
    <thead><tr><th>Area</th><th class="num">Alerts</th><th class="num">Total h</th><th class="num">Average</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${clickable ? "clickable" : ""}" ${clickable ? `data-area="${esc(r.name)}"` : ""}>
      <td>${esc(r.name)}</td><td class="num">${num(r.count)}</td>
      <td class="num">${num(Math.round(r.hours))}</td><td class="num">${hm(r.avg_min)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function standingBlock(st) {
  if (!st || !st.count) return "";
  const rows = st.examples.map(e => {
    const where = [e.hromada, e.raion, e.oblast].filter(Boolean)[0] || "–";
    return `<tr><td>${esc(where)}</td><td class="num">${(e.duration_min / 1440).toFixed(1)} d</td>
            <td class="num">${day(e.started_at)}</td></tr>`;
  }).join("");

  return `<section class="standing">
    <h2>Standing alerts — excluded from the figures above</h2>
    <div class="chart">
      <div class="note" style="margin:0 0 10px">
        ${num(st.count)} alert${st.count > 1 ? "s" : ""} ran for ${st.threshold_days} days or longer
        (${num(Math.round(st.hours))} h total). These are frontline territories where the siren stays
        declared for months — real records, but averaging them in would make “longest” and “average”
        meaningless. Set <em>Standing alerts → Include in statistics</em> to fold them back in.
      </div>
      <table>
        <thead><tr><th>Area</th><th class="num">Duration</th><th class="num">Started</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

boot();
</script>
</body>
</html>
